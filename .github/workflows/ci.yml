name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  design:
    name: Design tokens
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Tokens for every platform + contrast gate
        run: python3 design/colors.py
      - name: Design concept page
        run: python3 design/build.py
      - name: Generated files are committed
        run: git diff --exit-code -- design

  docs:
    name: Docs (the count in SPEC.md)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: The count matches the tables
        run: python3 .github/scripts/spec_count.py SPEC.md --check

  protocol:
    name: Protocol (buf lint)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: bufbuild/buf-action@v1
        with:
          input: protocol
          lint: true
          format: false
          breaking: false
          push: false
          pr_comment: false

  rust:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        if: matrix.os == 'ubuntu-24.04'
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Test
        # the 1,000 simulated scenarios run in the Simulation job, built for speed
        run: cargo test --workspace --exclude omnarc-simulation
      - name: Describe the runner
        run: cargo run -q -p omnarc-node -- info

  simulation:
    name: Simulation (1,000 scenarios)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: simulation
      - name: Crashes, restarts, partitions, lost and late messages — the agreed state survives
        run: cargo test -p omnarc-simulation --release -- --nocapture

  fuzz:
    name: Fuzz (a minute per target)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      # a fixed nightly: the nightly of 2026-10-12 panics compiling iroh-blobs
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-09-20
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: node/fuzz
      - name: What other devices send — frames, Protobuf, tickets, GGUF headers
        # rust-toolchain.toml pins stable for the rest of the repository; cargo-fuzz needs nightly, and the prebuilt
        # cargo-fuzz would build for musl unless told the target
        run: |
          for target in tensor_frame protobuf ticket gguf_header; do
            cargo +nightly-2026-09-20 fuzz run --target x86_64-unknown-linux-gnu --fuzz-dir node/fuzz "$target" -- -max_total_time=60 -rss_limit_mb=2048
          done

  mobile:
    name: Rust (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: aarch64-linux-android
          - os: macos-15
            target: aarch64-apple-ios
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - run: cargo check -p omnarc-protocol --target ${{ matrix.target }}

  engine:
    name: Engine (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    # a hung ring test must not hold the queue for the default six hours
    timeout-minutes: 60
    steps:
      - name: Keep LF line endings (the llama.cpp patches expect them)
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v5
        with:
          submodules: true
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: gguf-py dependencies (tiny test models)
        run: python -m pip install numpy pyyaml tqdm requests
      - name: A real test model (stories15M, 27 MB)
        id: model
        uses: actions/cache@v4
        with:
          path: build/models
          key: test-model-stories15M-q8_0
      - if: steps.model.outputs.cache-hit != 'true'
        shell: bash
        run: |
          mkdir -p build/models
          curl -sSfL --retry 3 -o build/models/stories15M-q8_0.gguf \
            https://huggingface.co/ggml-org/models-moved/resolve/main/tinyllamas/stories15M-q8_0.gguf
      - name: Configure (llama.cpp + engine/patches)
        shell: bash
        # GGML_NATIVE=OFF: the programs run on other machines too (x86-64 with AVX2, or ARM64)
        run: |
          cmake -S engine -B build/engine -DCMAKE_BUILD_TYPE=Release -DGGML_NATIVE=OFF \
            -DOMNARC_TEST_MODEL="${{ github.workspace }}/build/models/stories15M-q8_0.gguf"
      - name: Build
        shell: bash
        run: |
          set -o pipefail
          cmake --build build/engine --config Release --parallel 2>&1 | tee build/engine-build.log
      - name: Compiler errors as annotations
        if: failure()
        shell: bash
        run: |
          grep -E "error C[0-9]+|: error:|fatal error|error LNK" build/engine-build.log | sort -u | head -40 |
            while IFS= read -r line; do echo "::error::${line}"; done
      - name: C ABI and the accuracy gate
        run: ctest --test-dir build/engine -C Release --output-on-failure
      - uses: dtolnay/rust-toolchain@stable
      - name: The engine in its own process (Rust host and omnarc-engine)
        shell: bash
        env:
          OMNARC_ENGINE: ${{ github.workspace }}/build/engine/${{ runner.os == 'Windows' && 'Release/omnarc-engine.exe' || 'omnarc-engine' }}
          OMNARC_TEST_MODEL: ${{ github.workspace }}/build/models/stories15M-q8_0.gguf
        run: cargo test -p omnarc-engine-host --features engine-tests
      - name: A ring of two nodes generates what one device generates
        shell: bash
        env:
          OMNARC_ENGINE: ${{ github.workspace }}/build/engine/${{ runner.os == 'Windows' && 'Release/omnarc-engine.exe' || 'omnarc-engine' }}
          OMNARC_TEST_MODEL: ${{ github.workspace }}/build/models/stories15M-q8_0.gguf
        run: cargo test -p omnarc-node --features engine-tests
      - name: The model store reads a real GGUF header
        shell: bash
        env:
          OMNARC_TEST_MODEL: ${{ github.workspace }}/build/models/stories15M-q8_0.gguf
        run: cargo test -p omnarc-store
      - name: The Windows download script of the B1 gate, on a small model
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $list = Join-Path $env:RUNNER_TEMP "models.txt"
          "ggml-org/models-moved tinyllamas/stories15M-q8_0.gguf 26671328 2eda49203f2f044f3dddf29a7dd7cc861ef5a0340f518a19613d73ba6d9c06b6" | Set-Content $list
          $dir = Join-Path $env:RUNNER_TEMP "models"
          foreach ($run in 1, 2) {
            powershell -ExecutionPolicy Bypass -File bench\b1\download.ps1 -Dir $dir -List $list -Model all
            if ($LASTEXITCODE -ne 0) { exit 1 }
          }
      - name: Programs to try on real devices (omnarc-node next to omnarc-engine)
        if: github.event_name == 'push'
        shell: bash
        run: |
          cargo build --release -p omnarc-node
          mkdir -p dist
          exe=${{ runner.os == 'Windows' && '.exe' || '' }}
          cp "target/release/omnarc-node$exe" dist/
          cp "build/engine/${{ runner.os == 'Windows' && 'Release/' || '' }}omnarc-engine$exe" dist/
          cp "build/engine/${{ runner.os == 'Windows' && 'Release/' || '' }}omnarc-gate$exe" dist/
      - if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: omnarc-${{ runner.os }}-${{ runner.arch }}
          path: dist/
          retention-days: 30

  web:
    name: Web components
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Types and Svelte checks
        run: pnpm check
      - name: Unit tests
        run: pnpm test
      - name: Build the panel
        run: pnpm build
      - name: The panel's JavaScript budget (XC-03)
        run: node ../.github/scripts/budget.mjs apps/panel/build 180
      - name: Build Storybook
        run: pnpm build-storybook
      - name: Install Chromium
        run: pnpm --filter @omnarc/ui exec playwright install --with-deps chromium
      - name: Visual regression + axe (WCAG 2.2 AA)
        run: pnpm test:visual
      - name: Upload the visual report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-report
          path: |
            web/packages/ui/playwright-report
            web/packages/ui/test-results
          retention-days: 14
