syntax = "proto3";

package omnarc.v1;

import "omnarc/v1/device.proto";
import "omnarc/v1/pairing.proto";
import "omnarc/v1/plan.proto";
import "omnarc/v1/telemetry.proto";

// The control API every node serves to the panel and to apps (Connect RPC, protocol/CLUSTER.md §5).
service ClusterService {
  // A snapshot of the cluster.
  rpc GetCluster(GetClusterRequest) returns (GetClusterResponse);
  // A live stream of changes; the first event is a full snapshot.
  rpc WatchCluster(WatchClusterRequest) returns (stream WatchClusterResponse);
  // Creates a one-time ticket for the QR code that adds a device.
  rpc CreateTicket(CreateTicketRequest) returns (CreateTicketResponse);
  // The owner's answer for a device that asked to join: whether the four symbols match on both screens.
  rpc AnswerJoin(AnswerJoinRequest) returns (AnswerJoinResponse);
  // Removes a member from the cluster: the computers of the cluster agree on it and let it in no more. Admins only.
  rpc RemoveMember(RemoveMemberRequest) returns (RemoveMemberResponse);
  // Renames the cluster or changes its relays, once the cluster agrees. Admins only.
  rpc UpdateCluster(UpdateClusterRequest) returns (UpdateClusterResponse);
  // On a device that belongs to no cluster yet: creates one, with this device as its admin.
  rpc CreateCluster(CreateClusterRequest) returns (CreateClusterResponse);
  // On a device that belongs to no cluster yet: joins one with a ticket. First come the four symbols to compare with
  // the inviting device's screen, then, once its owner confirms, the cluster's name.
  rpc JoinCluster(JoinClusterRequest) returns (stream JoinClusterResponse);
  // What this device offers the cluster from now on (REQUIREMENTS Q1). Only this device's owner can change it.
  rpc SetBudget(SetBudgetRequest) returns (SetBudgetResponse);
  // Places a model on the cluster's devices within what each offers, and starts it (NO-41).
  rpc RunModel(RunModelRequest) returns (RunModelResponse);
  // Stops the model that runs, and frees what it took.
  rpc StopModel(StopModelRequest) returns (StopModelResponse);
  // Asks the running model; the answer streams back piece by piece, from whichever device holds the head.
  rpc Ask(AskRequest) returns (stream AskResponse);
  // The models this device holds, in whole or in part.
  rpc ListModels(ListModelsRequest) returns (ListModelsResponse);
}

message ClusterSnapshot {
  ClusterId id = 1;
  string name = 2;
  repeated DeviceInfo devices = 3;
  repeated Telemetry telemetry = 4;
  repeated PlacementPlan plans = 5;
  // The node that serves this API.
  NodeId this_node = 6;
  // Whether this node can admit devices (it holds the cluster key).
  bool can_invite = 7;
  // The cluster's relays (protocol/CLUSTER.md §3.5), without their tokens.
  repeated string relays = 8;
  // A faster plan for the running model than the one it runs, now that the devices or their offers changed (NO-48).
  PlanSuggestion suggestion = 9;
}

message PlanSuggestion {
  PlacementPlan plan = 1;
  // What one token would take with it, and takes with the running plan, in milliseconds.
  float ms_per_token = 2;
  float current_ms_per_token = 3;
}

message GetClusterRequest {}

message GetClusterResponse {
  ClusterSnapshot cluster = 1;
}

message WatchClusterRequest {}

message WatchClusterResponse {
  oneof event {
    ClusterSnapshot snapshot = 1;
    // A device joined, or what it is changed.
    DeviceInfo device_joined = 2;
    NodeId device_left = 3;
    Telemetry telemetry = 4;
    PlacementPlan plan_changed = 5;
    // A device asks to join and waits for the owner: answer with AnswerJoin.
    JoinAttempt join_attempt = 6;
    // A device was removed from the cluster: it is let in no more.
    NodeId device_removed = 7;
  }
}

// One of the four symbols both screens show while a device joins (protocol/CLUSTER.md §2.4).
message SasSymbol {
  string emoji = 1;
  // The English name, for screen readers.
  string name = 2;
}

message JoinAttempt {
  NodeId joiner = 1;
  DeviceInfo device = 2;
  repeated SasSymbol symbols = 3;
}

message CreateTicketRequest {
  // Ticket lifetime; the node caps it at 10 minutes.
  uint32 ttl_seconds = 1;
}

message CreateTicketResponse {
  ClusterTicket ticket = 1;
  // The ticket encoded for a QR code: "OMNARC:" + base32 of the serialized ticket.
  string qr_payload = 2;
  // The QR code as an SVG image.
  string qr_svg = 3;
}

message AnswerJoinRequest {
  NodeId joiner = 1;
  bool matches = 2;
}

message AnswerJoinResponse {
  // Whether the device was still waiting for the answer.
  bool waited = 1;
}

message RemoveMemberRequest {
  NodeId member = 1;
}

message RemoveMemberResponse {}

message CreateClusterRequest {
  string name = 1;
  // Relays for devices on other networks (protocol/CLUSTER.md §3.5), with their tokens.
  repeated string relays = 2;
}

message CreateClusterResponse {}

message JoinClusterRequest {
  // The text of the ticket, starting with OMNARC:.
  string ticket = 1;
  // This device's name in the cluster; empty: its host name.
  string device_name = 2;
}

message JoinClusterResponse {
  oneof step {
    SasSymbols symbols = 1;
    // The name of the cluster this device joined.
    string joined = 2;
  }
}

message SasSymbols {
  repeated SasSymbol symbols = 1;
}

message UpdateClusterRequest {
  // A new name; empty: the name stays.
  string name = 1;
  // A relay to add, with its token if it wants one; empty: none.
  string add_relay = 2;
  // A relay to remove, by its address; empty: none.
  string remove_relay = 3;
}

message UpdateClusterResponse {}

message SetBudgetRequest {
  Budget budget = 1;
}

message SetBudgetResponse {}

message RunModelRequest {
  // A model in some member's store, by its BLAKE3 hash (hex) or its name; empty: the only one there is.
  string model = 1;
  RunMode mode = 2;
  // Context length the KV cache is planned for; 0: 4096.
  uint32 context = 3;
  // Only answer "Will it fit?": the plan the model would get, without starting it.
  bool dry_run = 4;
}

message RunModelResponse {
  PlacementPlan plan = 1;
  // The devices the plan leaves out, and why.
  repeated LeftOutDevice left_out = 2;
  // What the plan expects one token to take, in milliseconds.
  float estimated_ms_per_token = 3;
}

message LeftOutDevice {
  NodeId node = 1;
  // "too_small": it offers less than one layer needs; "not_needed": the model runs faster without it.
  string reason = 2;
}

message ListModelsRequest {}

message ListModelsResponse {
  repeated ModelInfo models = 1;
}

message ModelInfo {
  string name = 1;
  // BLAKE3 hash of the GGUF file, hex.
  string blake3 = 2;
  uint64 file_bytes = 3;
  uint32 layer_count = 4;
  // Whether every byte of the file is on this device: only then can it start the model.
  bool complete = 5;
}

message StopModelRequest {}

message StopModelResponse {}

message AskRequest {
  string prompt = 1;
  // At most this many tokens; 0: 256.
  uint32 max_tokens = 2;
  // Accuracy mode (EN-23): the question is answered this many times, on the model's whole copies where there are
  // several, and the answer most of them agree on is the one given; 0 or 1: one answer.
  uint32 paths = 3;
  // Sampling temperature; 0: greedy. Accuracy mode samples each path, at 0.7 when this is 0.
  float temperature = 4;
  // The sampler's seed, so the paths of accuracy mode differ.
  uint64 seed = 5;
}

message AskResponse {
  oneof step {
    // The next piece of the answer.
    string piece = 1;
    AskDone done = 2;
  }
}

message AskDone {
  uint32 prompt_tokens = 1;
  uint32 generated_tokens = 2;
  // Time to the first token and mean time per token after it, in milliseconds.
  float ttft_ms = 3;
  float tpot_ms = 4;
  // In accuracy mode: the paths answered, and how many of them gave the answer chosen.
  uint32 paths = 5;
  uint32 agreed = 6;
}
