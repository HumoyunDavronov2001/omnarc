[package]
name = "omnarc-node"
description = "The Omnarc agent that runs on every device."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "omnarc-node"
path = "src/main.rs"

[target.'cfg(windows)'.dependencies]
# where the power comes from (GetSystemPowerStatus)
windows-sys = { version = "0.61", features = ["Win32_System_Power"] }

[features]
default = ["coordinator"]
# the placement runs on the computers that keep the cluster's log; phones and browsers only follow it
coordinator = ["dep:omnarc-scheduler"]
# Integration tests that run a ring with a real omnarc-engine; they need OMNARC_ENGINE and OMNARC_TEST_MODEL.
engine-tests = []

[[test]]
name = "ring"
required-features = ["engine-tests"]

[[test]]
name = "cluster"
required-features = ["engine-tests", "coordinator"]

[dependencies]
omnarc-engine-host.workspace = true
omnarc-network.workspace = true
omnarc-protocol.workspace = true
clap.workspace = true
tokio.workspace = true
sysinfo.workspace = true
serde_json.workspace = true
prost.workspace = true
redb.workspace = true
qrcode.workspace = true
n0-future.workspace = true
omnarc-api.workspace = true
omnarc-store.workspace = true
openraft.workspace = true
futures-util.workspace = true
# downloading a model once: the HTTP client, TLS and hashing iroh already brings
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "stream"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
ring = "0.17"
serde.workspace = true
axum.workspace = true
# the owner's hours (Q1) are local time
chrono = { version = "0.4", default-features = false, features = ["clock"] }
omnarc-scheduler = { path = "../omnarc-scheduler", optional = true }

[dev-dependencies]
omnarc-store = { workspace = true, features = ["testing"] }
# a relay server inside the tests
iroh-relay = { version = "1.3", default-features = false, features = ["server"] }

# the workspace's lints, but unsafe code is denied rather than forbidden: one Windows call in src/sensors.rs needs it
[lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
undocumented_unsafe_blocks = "warn"
